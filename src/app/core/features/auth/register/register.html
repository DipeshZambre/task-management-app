<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">✓</span>
      </div>
      <h1>Create account</h1>
      <p>Start managing your tasks today</p>
    </div>

    <!-- API Error -->
    <div class="alert alert-error" *ngIf="errorMessage">
      <span class="alert-icon">⚠</span>
      {{ errorMessage }}
    </div>

    <!-- Success -->
    <div class="alert alert-success" *ngIf="successMessage">
      <span class="alert-icon">✓</span>
      {{ successMessage }}
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="onSubmit()" novalidate>

      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="johndoe"
          autocomplete="username"
          [class.input-error]="usernameInvalid"
        />
        <span class="field-error" *ngIf="usernameInvalid">
          Please enter a username.
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="text"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          [class.input-error]="emailInvalid"
        />
        <span class="field-error" *ngIf="emailInvalid">
          Please enter a valid email address.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="new-password"
          [class.input-error]="passwordInvalid"
        />
        <span class="field-error" *ngIf="passwordInvalid">
          Please enter a password.
        </span>
        <span class="field-hint" *ngIf="!passwordInvalid">Minimum 6 characters</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

    </form>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
